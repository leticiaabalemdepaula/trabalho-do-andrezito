<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG - Jornada Épica</title>
    <!-- Chamando o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Masmorras Dinâmicas RPG</h1>
    
    <div class="container">
        <div class="ambient-text" id="ambient-container">
            <span id="ambient-title">Prepare-se para a jornada...</span>
        </div>

        <div id="setup-screen">
            <h2 style="color: #4ade80; margin-top: 0;">Configuração do Herói</h2>
            
            <div class="input-group">
                <label for="char-name">Nome do seu Herói:</label>
                <input type="text" id="char-name" value="Ragnar" placeholder="Ex: Ragnar, Gandalf, Legolas...">
            </div>
            
            <div class="input-group">
                <label for="char-class">Selecione sua Classe de Combate:</label>
                <select id="char-class">
                    <option value="Guerreiro">🛡️ Guerreiro (Forte / Habilidade: Golpe Devastador)</option>
                    <option value="Mago">🔮 Mago (Frágil / Habilidade: Explosão Arcana)</option>
                    <option value="Arqueiro">🏹 Arqueiro (Equilibrado / Habilidade: Chuva de Flechas)</option>
                </select>
            </div>
            
            <button onclick="iniciarJogo()" style="width: 100%; margin-top: 10px; font-size: 18px;">COMEÇAR NOVA JORNADA</button>
            <button onclick="carregarJogo()" style="background-color: #3b82f6; width: 100%; margin-top: 10px; font-size: 16px;">💾 CARREGAR JOGO SALVO</button>
        </div>

        <div id="game-screen" class="hidden">
            <div class="battle-arena">
                <div id="player-card" class="char-card">
                    <h3 id="display-name" style="margin: 0 0 5px 0;">Nome</h3>
                    <div id="display-class" style="color: #4ade80; font-size: 13px; font-weight: bold; text-transform: uppercase;">Classe</div>
                    <img id="player-img" class="char-img" src="" alt="Avatar">
                    
                    <p style="margin: 5px 0; font-weight: bold; color: #60a5fa;">⭐ Nível: <span id="display-level">1</span></p>
                    <p style="margin: 5px 0;">💰 Ouro: <span id="display-gold" style="color: #ffd700; font-weight: bold;">100</span>g</p>
                    <p style="margin: 5px 0;">⚔️ Dano Base: <span id="display-damage" style="font-weight: bold;">10</span></p>
                    <p style="margin: 5px 0; color: #fb7185; font-weight: bold;">🧪 Poções de Cura: <span id="display-potions">0</span></p>
                    
                    <div class="bar-container">
                        <div class="bar-text"><span>HP:</span> <span id="player-hp-text">100/100</span></div>
                        <div class="bar-outer"><div id="player-hp-bar" class="bar-inner-hp"></div></div>
                    </div>
                    <div class="bar-container">
                        <div class="bar-text"><span>MP (Mana):</span> <span id="player-mp-text">50/50</span></div>
                        <div class="bar-outer"><div id="player-mp-bar" class="bar-inner-mp"></div></div>
                    </div>
                    <div class="bar-container">
                        <div class="bar-text"><span>EXP:</span> <span id="player-xp-text">0/100</span></div>
                        <div class="bar-outer"><div id="player-xp-bar" class="bar-inner-xp"></div></div>
                    </div>
                </div>

                <div id="enemy-card" class="char-card">
                    <h3 id="enemy-name" style="margin: 0 0 5px 0;">Monstro</h3>
                    <div id="enemy-type-badge" style="color: #ef4444; font-size: 13px; font-weight: bold; text-transform: uppercase;">⚠️ Criatura</div>
                    <img id="enemy-img" class="char-img" src="" alt="Avatar Monstro">
                    
                    <p style="margin: 5px 0;">💀 Dano: <span id="enemy-damage-text" style="font-weight: bold;">8</span></p>
                    <p style="margin: 5px 0; color: #a7f3d0;">Loot: <span id="enemy-gold-reward" style="color: #ffd700;">40</span>g | <span id="enemy-xp-reward" style="color: #60a5fa; font-weight: bold;">20 XP</span></p>
                    
                    <div class="bar-container">
                        <div class="bar-text"><span>HP:</span> <span id="enemy-hp-text">50/50</span></div>
                        <div class="bar-outer"><div id="enemy-hp-bar" class="bar-inner-hp"></div></div>
                    </div>
                </div>
            </div>

            <div id="combat-log" class="log-container"></div>

            <div class="battle-actions">
                <button id="btn-atacar" onclick="atacar()" style="background-color: #ef4444; color: white;">⚔️ ATACAR</button>
                <button id="btn-especial" onclick="atacarEspecial()" style="background-color: #a855f7; color: white;">✨ ESPECIAL (-20 MP)</button>
                <button id="btn-pocao" onclick="usarPocao()" style="background-color: #fb7185; color: white;">🧪 USAR POÇÃO</button>
                
                <button id="next-enemy-btn" class="hidden" onclick="proximoInimigo()" style="background-color: #22c55e; color: #051408; font-size: 18px; width: 100%;">👣 AVANÇAR</button>
            </div>

            <div class="shop-section">
                <h3 class="shop-title">🏪 Mercado Mercenário</h3>
                <div id="shop-items" class="shop-items"></div>
            </div>
        </div>
    </div>

    <!-- Chamando o arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
